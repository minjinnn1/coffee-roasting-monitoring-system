<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roast Control — Вход</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="login">
  <div class="app-shell" style="max-width:480px;">
    <section class="panel">
      <h2>Вход в систему</h2>
      <p style="margin-bottom:12px;">Введите учетные данные для доступа к панели.</p>
      <form id="loginForm" class="form">
        <label for="loginUsername">Логин</label>
        <input id="loginUsername" name="username" type="text" placeholder="admin" required />
        <label for="loginPassword">Пароль</label>
        <input id="loginPassword" name="password" type="password" placeholder="••••••••" required />
        <div id="loginError" style="color:#fca5a5; min-height:18px; font-size:13px; margin-top:6px;"></div>
        <button type="submit">Войти</button>
      </form>
    </section>
  </div>
  <script defer src="assets/data.js"></script>
  <script defer src="assets/auth.js"></script>
  <script defer src="assets/api.js"></script>
  <script defer src="assets/charts.js"></script>
  <script defer src="assets/dashboard.js"></script>
  <script defer src="assets/page-alarms.js"></script>
  <script defer src="assets/page-batches.js"></script>
  <script defer src="assets/page-recipes.js"></script>
  <script defer src="assets/app.js"></script>
</body>
</html>
